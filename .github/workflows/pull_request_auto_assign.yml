name: PR Auto Assign

on:
  pull_request:
    types: [opened, reopened]
    branches: ["main"]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          configuration-path: ".github/auto_assign.yml"
